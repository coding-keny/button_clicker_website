<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Clicker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #03f7ff;
        }

        .click_counter {
            margin-left: 500px;
            margin-top: 120px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 90px;
        }

        button:hover {
            transform: scale(1.05);
            transition: transform 0.3s;
        }

        .flexbox {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .buy_click{
            margin-left: 60px;
        }
        .shop {
            padding: 20px;
            border: 2px solid #000000;
            border-radius: 10px;
            background-color: #fff;
            display: inline-block;
            height: 460px;
            width: 360px;
            margin-left: 150px;
            margin-top: -50px;
        }

        h1 {
            font-size: 36px;
            margin-right: 350px;
            margin-top: -250px;
        }

        p {
            font-size: 18px;
            margin-bottom: 150px;
            margin-left: -500px;
            margin-right: -90px;
        }

        @media (max-width: 1260px) {
            .flexbox {
                text-align: center;
                align-items: center;
                justify-content: center;
                display: flex;
            }

            body {
                text-align: center;
            }

            button {
                margin-left: 30px;
            }

            p {
                margin-left: -50px
            }

            .click_counter {
                margin-right: -50px;
                margin-top: -100px;
                white-space: nowrap;

            }
            h1{margin-right: -60px;}
            .shop{right: 350px;}
        }
    </style>

    <script>
        let clickValue = 1;
        let clickCount = 0;

        function incrementClickCount(amount) {
            clickCount += amount;

            document.getElementById("clickCount").innerText =
                "Score: " + clickCount;
        }

        function buyClick() {
            if (clickCount >= 10) {
                clickCount -= 10;
                clickValue += 1;

                document.getElementById("clickCount").innerText =
                    "Score: " + clickCount;

                document.getElementById("clickValueDisplay").innerText =
                    "Clicks per click: " + clickValue;
            } else {
                alert("Not enough points to buy a click!");
            }
        }
    </script>
</head>

<body>
    <div class="flexbox">

        <div class="click_counter">
            <p id="clickValueDisplay">
                Clicks per click: 1
            </p>
        </div>

        <u>
            <h1>Clicker Game</h1>
        </u>

        <p id="clickCount">Score: 0</p>

        <button onclick="incrementClickCount(clickValue)">
            Click Me!
        </button>

        <div class="shop">
            <h2>
                <u>Welcome to the Clicker Shop</u>
            </h2>
          <div class = "buy_click">
            <button onclick="buyClick()">
                Buy 1 click for 10 points
            </button>
          </div>
        </div>

    </div>
</body>
</html>
