<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Clicker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #03f7ff;
        }

        .click_counter {
            margin-left: 500px;
            margin-top: 120px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 90px;
        }

        button:hover {
            transform: scale(1.05);
            transition: transform 0.3s;
        }

        .flexbox {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .buy_click{
            margin-left: 60px;
        }
        .shop {
            padding: 20px;
            border: 2px solid #000000;
            border-radius: 10px;
            background-color: #fff;
            display: inline-block;
            height: 460px;
            width: 360px;
            margin-left: 150px;
            margin-top: -50px;
        }

        h1 {
            font-size: 36px;
            margin-right: 350px;
            margin-top: -250px;
        }
        .fortune_button{
            margin-top: 300px;
            margin-left: -550px;
            margin-right: 300px;
            width: 140px;
            height: 260px;
            background-color: #fff;
            text-align: left;
            border: 2px solid #000000;
            border-radius: 20px;
            padding-left: 50px;
            margin-bottom: -50px;
        }
        p {
            font-size: 18px;
            margin-bottom: 150px;
            margin-left: -500px;
            margin-right: -90px;
        }
        @media (max-width: 1260px) {
            .flexbox {
                text-align: center;
                align-items: center;
                justify-content: center;
                display: flex;
            }

            body {
                text-align: center;
            }

            button {
                margin-left: 30px;
            }

            p {
                margin-left: -50px
            }

            .click_counter {
                margin-right: -50px;
                margin-top: -100px;
                white-space: nowrap;

            }
            .fortune_button{
            margin-right: 0px;
            margin-left: -200px;
            text-align: center;
            padding-left: 0px;}
            h1{margin-right: -60px;}
            .shop{margin-right: 350px;}
        }
    </style>

    <script>
        let clickValue = 1;
        let clickCount = 0;
        let bad_rolls = 0;
        let good_rolls = 0;

        function incrementClickCount(amount) {
            clickCount += amount;

            document.getElementById("clickCount").innerText =
                "Score: " + clickCount;
            if (clickCount >= 10){
                document.getElementById("button_id").style.backgroundColor = "white";
            }
            else{
                document.getElementById("button_id").style.backgroundColor = "darkgrey";
            }
        }

        function buyClick() {
            if (clickCount >= 10) {
                clickCount -= 10;
                clickValue += 1;

                document.getElementById("clickCount").innerText =
                    "Score: " + clickCount;

                document.getElementById("clickValueDisplay").innerText =
                    "Clicks per click: " + clickValue;
            } else {
                alert("Not enough points to buy a click!");
            }
            if (clickCount >= 10){
                document.getElementById("button_id").style.backgroundColor = "white";
            }
            else{
                document.getElementById("button_id").style.backgroundColor = "darkgrey";
            }
        }
    function random_num() {
     let num = Math.floor(Math.random() * clickCount);
     let sub_or_add = Math.floor(Math.random() * 3) + 1;
     if (clickCount >= 2){
     if (sub_or_add >= 2) {
        clickCount = clickCount + num;
        good_rolls = good_rolls+1
        document.getElementById("fortune_id").style.backgroundColor = "green"
        document.getElementById("good_rolls_id").innerText = "good rolls: " + good_rolls 
     } else {
        clickCount = clickCount - num;
        bad_rolls = bad_rolls+1
        document.getElementById("fortune_id").style.backgroundColor = "red"
        document.getElementById("bad_rolls_id").innerText = "bad rolls: " + bad_rolls
     }

     document.getElementById("clickCount").innerText =
        "Score: " + clickCount;
   }
   else{
    good_rolls = good_rolls+1
    document.getElementById("good_rolls_id").innerText = "good rolls: " + good_rolls 
    clickCount+=1
    document.getElementById("clickCount").innerText =
    "Score: " + clickCount;
    document.getElementById("fortune_id").style.backgroundColor = "green"
   }
    if (clickCount >= 10){
     document.getElementById("button_id").style.backgroundColor = "white";
    }
    else{
    document.getElementById("button_id").style.backgroundColor = "darkgrey";
    }    
   }

    </script>
</head>

<body>
    <div class="flexbox">

        <div class="click_counter">
            <p id="clickValueDisplay">
                Clicks per click: 1
            </p>
        </div>

        <u>
            <h1>Clicker Game</h1>
        </u>

        <p id="clickCount">Score: 0</p>

        <button onclick="incrementClickCount(clickValue)">
            Click Me!
        </button>

        <div class = "fortune_button">
          <u>
          <h2>rolling center</h2>
          </u>
          <h4 id = "good_rolls_id">good rolls: 0</h4>
          <h4 id = "bad_rolls_id">bad rolls: 0</h4>
          <button onclick ="random_num()" id = "fortune_id">rolling button</button>
        </div>

        <div class="shop">
            <h2>
                <u>Welcome to the Clicker Shop</u>
            </h2>
          <div class = "buy_click">
            <button onclick="buyClick()" id = "button_id">
                Buy 1 click for 10 points
            </button>
          </div>
        </div>
    </div>
</body>
</html>
